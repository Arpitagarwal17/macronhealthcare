<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#063b78" />
    <title>Macron Health Care — Connection unavailable</title>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        window.Capacitor?.Plugins?.SplashScreen?.hide?.();
      });
    </script>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); background: linear-gradient(145deg, #f7fbff 0%, #ffffff 58%, #eef8f7 100%); color: #102033; }
      main { width: min(100%, 480px); padding: 32px; border: 1px solid #dce7f2; border-radius: 20px; background: rgba(255, 255, 255, 0.96); box-shadow: 0 18px 45px rgba(6, 59, 120, 0.12); text-align: center; }
      .mark { display: grid; width: 64px; height: 64px; margin: 0 auto 20px; place-items: center; border-radius: 18px; background: #063b78; color: white; font-size: 25px; font-weight: 800; letter-spacing: -0.05em; }
      h1 { margin: 0; color: #063b78; font-size: clamp(1.65rem, 7vw, 2.25rem); line-height: 1.1; }
      p { margin: 16px auto 0; max-width: 36ch; color: #526477; font-size: 1rem; line-height: 1.65; }
      button { min-height: 48px; margin-top: 24px; padding: 0 24px; border: 0; border-radius: 12px; background: #063b78; color: white; font: inherit; font-weight: 750; cursor: pointer; }
      button:focus-visible { outline: 3px solid rgba(0, 150, 136, 0.45); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M+</div>
      <h1>Connection unavailable</h1>
      <p>Macron Health Care could not be reached. Check your internet connection, then try again.</p>
      <button type="button" onclick="window.location.replace('https://www.macronhealthcare.com')">Retry connection</button>
    </main>
  </body>
</html>
